<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espaço da Beleza - Cartão Fidelidade</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS (Excel) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        .gold-gradient {
            background: linear-gradient(135deg, #f5d77f 0%, #d4af37 50%, #aa771c 100%);
        }
        .card-bg {
            background: linear-gradient(145deg, #121212 0%, #1a1a1a 100%);
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
        .card-shadow {
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.7), 0 0 20px rgba(212, 175, 55, 0.15);
        }
    </style>
</head>
<body class="bg-black text-gray-100 min-h-screen font-sans antialiased">

    <!-- Navegação de Abas Discreta -->
    <header class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xs font-bold tracking-widest text-amber-400 uppercase">Espaço da Beleza</h1>
            <div class="flex space-x-2">
                <button onclick="switchTab('client')" id="btn-client" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-500 text-black transition shadow-sm">Cartão Cliente</button>
                <button onclick="switchTab('admin')" id="btn-admin" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-zinc-800 text-zinc-400 hover:text-zinc-200 transition">Área Restrita / Admin</button>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 py-6">

        <!-- ABA DO CLIENTE (Visualização Elegante e Exclusiva) -->
        <div id="tab-client" class="space-y-6">
            <div class="card-bg rounded-3xl p-6 card-shadow text-center relative overflow-hidden">
                <!-- Detalhe de luz decorativo -->
                <div class="absolute -right-12 -top-12 w-36 h-36 bg-amber-500/10 rounded-full blur-3xl"></div>
                <div class="absolute -left-12 -bottom-12 w-36 h-36 bg-amber-600/10 rounded-full blur-3xl"></div>
                
                <h2 class="text-2xl font-serif font-bold text-amber-300 tracking-wide">Espaço da Beleza</h2>
                <p class="text-[11px] text-amber-400/70 uppercase tracking-widest mt-1">Cartão Fidelidade Digital</p>

                <!-- Informações da Cliente -->
                <div class="mt-6 flex justify-between items-center bg-zinc-950/80 p-3.5 rounded-2xl border border-zinc-800/80 text-left">
                    <div>
                        <p class="text-[10px] text-zinc-400 uppercase tracking-wider">Cliente</p>
                        <p id="client-display-name" class="font-bold text-sm text-zinc-100">Maria Silva</p>
                        <p id="client-display-status" class="text-xs text-amber-400 font-medium mt-0.5">0 pontos acumulados</p>
                    </div>
                    <div class="text-right bg-zinc-900 px-3 py-1.5 rounded-xl border border-zinc-800">
                        <span class="text-[9px] text-zinc-400 block tracking-widest">ID CARTÃO</span>
                        <span id="client-display-id" class="text-xs font-mono font-bold text-amber-300">EB-1001</span>
                    </div>
                </div>

                <!-- Alerta de Validade -->
                <div id="client-expiry-alert" class="mt-4 bg-amber-500/10 border border-amber-500/30 rounded-2xl p-3 text-xs text-amber-200/90 flex items-center space-x-2.5 text-left">
                    <span class="text-base">✨</span>
                    <span id="client-expiry-text">Você tem 60 dias para completar o cartão a partir do 1º ponto.</span>
                </div>

                <!-- Grade de Selos Luxuosa (10 pontos) -->
                <div class="grid grid-cols-5 gap-3 mt-6"
