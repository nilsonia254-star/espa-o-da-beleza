<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espaço da Beleza - Painel Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        .gold-gradient { background: linear-gradient(135deg, #f5d77f 0%, #d4af37 50%, #aa771c 100%); }
        .card-bg { background: linear-gradient(145deg, #121212 0%, #1a1a1a 100%); border: 1px solid rgba(212, 175, 55, 0.3); }
        .card-shadow { box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.7); }
    </style>
</head>
<body class="bg-black text-gray-100 min-h-screen font-sans antialiased p-4 flex items-center justify-center">

    <main class="w-full max-w-md space-y-6">
        
        <!-- Tela de Login -->
        <div id="admin-login-box" class="card-bg rounded-3xl p-6 text-center space-y-4 card-shadow">
            <div class="w-12 h-12 bg-amber-500/10 rounded-full flex items-center justify-center mx-auto text-amber-400 text-xl font-bold border border-amber-500/20">🔒</div>
            <h3 class="font-bold text-base text-zinc-100">Painel Administrativo</h3>
            <p class="text-xs text-zinc-400">Digite a senha para gerenciar os pontos (Senha: 12345)</p>
            <input type="password" id="admin-password" placeholder="Senha" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-center text-zinc-100 focus:outline-none focus:border-amber-500">
            <button onclick="verifyPassword()" class="w-full gold-gradient text-black font-bold py-2.5 rounded-xl text-sm transition shadow-lg">Entrar</button>
            <p id="login-error" class="text-xs text-red-400 hidden">Senha incorreta!</p>
        </div>

        <!-- Painel Real (Protegido) -->
        <div id="admin-panel-content" class="hidden space-y-4">
            <div class="card-bg rounded-3xl p-5 space-y-4 card-shadow">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-sm text-amber-300">Gerenciar Cliente</h3>
                    <a href="index.html" target="_blank" class="text-xs text-amber-400 underline">Ver Cartão Público</a>
                </div>

                <div class="space-y-3">
                    <div>
                        <label class="text-xs text-zinc-400 block mb-1">Nome da Cliente</label>
                        <input type="text" id="admin-client-name" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-sm text-zinc-100 focus:outline-none focus:border-amber-500" onchange="saveData()">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-xs text-zinc-400 block mb-1">ID do Cartão</label>
                            <input type="text" id="admin-client-id" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-sm text-zinc-100 focus:outline-none focus:border-amber-500" onchange="saveData()">
                        </div>
                        <div>
                            <label class="text-xs text-zinc-400 block mb-1">Pontos Atuais (0 a 10)</label>
                            <input type="number" id="admin-client-points" min="0" max="10" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-sm text-amber-400 font-bold focus:outline-none focus:border-amber-500" onchange="setPoints(this.value)">
                        </div>
                    </div>
                </div>

                <div class="pt-2">
                    <label class="text-xs text-zinc-400 block mb-2">Adicionar Pontos:</label>
                    <div class="grid grid-cols-5 gap-2">
                        <button onclick="addPoints(1)" class="bg-zinc-900 hover:bg-amber-500 hover:text-black text-amber-400 font-bold py-2 rounded-xl text-xs border border-zinc-800">+1</button>
